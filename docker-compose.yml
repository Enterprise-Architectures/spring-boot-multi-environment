services:
  dev-db:
    image: postgres:17-alpine
    container_name: java-lab2-dev-postgres
    environment:
      POSTGRES_DB: java_lab_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    ports:
      - "5433:5432"
    volumes:
      - ./db/dev/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d java_lab_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  prod-db:
    image: mysql:8.4
    container_name: java-lab2-prod-mysql
    environment:
      MYSQL_DATABASE: java_lab_prod
      MYSQL_USER: prod_user
      MYSQL_PASSWORD: prod_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - ./db/prod/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 3s
      retries: 30
